[project]
name = "acceleraremvp"
version = "0.1.0"
description = "Accelerare survey platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=25.1.0",
    "django>=6.1.2",
    "django-allauth>=65.19.7",
    "django-environ>=0.14.0",
    "gunicorn>=26.2.0",
    "phonenumbers>=9.0.41",
    "psycopg[binary]>=3.3.6",
    "sentry-sdk>=2.71.0",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.local"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["apps/*/migrations"]  # generated by Django, never hand-edited

[tool.ruff.lint]
# RUF012 flags class-level lists/dicts; Django models and Meta use them by design.
ignore = ["RUF012"]
