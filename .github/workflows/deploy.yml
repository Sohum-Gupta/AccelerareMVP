# Builds the production image for ARM (the AWS server's chip), smoke-tests it,
# and on main publishes it to GitHub's container registry (ghcr.io).
#
# On push to main:  CI runs first; if it passes, the image is built and pushed.
# On pull requests that touch the image inputs: the image is built and
# smoke-tested but never pushed, so a broken Dockerfile is caught before merge.
# After a push to main publishes the image, the deploy job copies deploy/ to the
# server over SSH and runs deploy.sh there. Pull requests never reach the server.
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - pyproject.toml
      - uv.lock
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a publish half way; a superseded pull request run can be cancelled.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    # On pull requests ci.yml already runs by itself, so skip the copy here.
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/ci.yml

  image:
    needs: ci
    # Run when CI passed, or when it was skipped (pull requests). Not when it failed.
    if: ${{ !cancelled() && (needs.ci.result == 'success' || needs.ci.result == 'skipped') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write # lets the built-in token push to ghcr.io; no other secret is used
    env:
      PUBLISH: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}

    steps:
      - uses: actions/checkout@v7.0.1

      # The runner is x86. QEMU lets it build and run ARM images by emulation.
      - uses: docker/setup-qemu-action@v4.4.0
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v4.4.1

      # Registries require lowercase names; the repository name may not be.
      # Deriving it here means moving the repo to another account needs no edits.
      - name: Work out the image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: Build ARM image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: smoke-test:local
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Boot the ARM image under emulation and ask it the questions that matter.
      # Throwaway values only (a random key, so the key-strength check stays meaningful);
      # /health does not touch the database.
      - name: Smoke test
        run: |
          docker run -d --name smoke --platform linux/arm64 -p 8000:8000 \
            -e SECRET_KEY="$(openssl rand -hex 32)" \
            -e ALLOWED_HOSTS=localhost \
            -e DATABASE_URL=postgres://u:p@localhost:5432/db \
            -e EMAIL_HOST=smtp.example.com \
            -e EMAIL_HOST_USER=u \
            -e EMAIL_HOST_PASSWORD=p \
            -e DEFAULT_FROM_EMAIL=smoke@example.com \
            smoke-test:local
          body=""
          for i in $(seq 1 60); do
            body=$(curl -s -H "X-Forwarded-Proto: https" http://localhost:8000/health || true)
            [ "$body" = "ok" ] && break
            sleep 2
          done
          docker logs smoke
          test "$body" = "ok"
          # Any warning fails the run, not just errors, so a new security warning is caught here.
          docker exec smoke python manage.py check --deploy --fail-level WARNING
          docker exec smoke id -un | grep -qx app

      - name: Log in to ghcr.io
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same inputs as the build above, so every layer comes from the cache.
      - name: Push image
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha

  # Runs only after the image was built, smoke-tested and pushed from main.
  # Three repository secrets are needed (Settings > Secrets and variables > Actions):
  #   DEPLOY_HOST        the server's address
  #   DEPLOY_SSH_KEY     private half of a key used only for deploys
  #   DEPLOY_KNOWN_HOSTS the server's SSH host key, so a lookalike server is refused
  deploy:
    needs: image
    if: ${{ !cancelled() && needs.image.result == 'success' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    # One deploy at a time, and never cut one off half way.
    concurrency:
      group: server-deploy
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Trust only our server, and load the deploy key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      # StrictHostKeyChecking=yes refuses to connect if the server's key is not the one
      # in known_hosts, instead of asking or silently accepting.
      - name: Copy the server files
        run: |
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            deploy/docker-compose.yml deploy/Caddyfile deploy/deploy.sh deploy/render_env.py \
            "ubuntu@${DEPLOY_HOST}:/opt/survey/"

      - name: Run deploy.sh on the server
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "ubuntu@${DEPLOY_HOST}" /opt/survey/deploy.sh
