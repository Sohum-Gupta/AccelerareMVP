<!doctype html>
<!--
"Something went wrong". This page is shown when something has already failed,
so it must not be able to fail itself: it is fixed text with its own few lines
of styling. No template tags, no stylesheet to look up, no database, no
account. Keep it that way (tests/test_error_pages.py checks).
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Something went wrong · Accelerare</title>
  <style>
    body { margin: 0; background: #f8fafc; color: #0f172a; font-family: ui-sans-serif, system-ui, sans-serif; line-height: 1.5; }
    header { background: #fff; border-bottom: 1px solid #e2e8f0; padding: 0.75rem 1rem; }
    header a { color: #0f172a; font-size: 1.125rem; font-weight: 600; text-decoration: none; }
    main { max-width: 28rem; margin: 0 auto; padding: 2rem 1rem; }
    h1 { font-size: 1.5rem; margin: 0 0 1rem; }
    a { color: #1d4ed8; }
  </style>
</head>
<body>
  <header><a href="/">Accelerare</a></header>
  <main>
    <h1>Something went wrong</h1>
    <p>That did not work, and it is our fault, not yours. We have been told about it.</p>
    <p>Anything you had already saved is still saved. Please try again in a minute.</p>
    <p><a href="/">Go to the start page</a></p>
  </main>
</body>
</html>
