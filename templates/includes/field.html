{# One form field: label, input, help text and errors. Usage: {% include "includes/field.html" with field=form.email %} #}
<div class="mb-4">
  <label for="{{ field.id_for_label }}">{{ field.label }}</label>
  {{ field }}
  {% if field.help_text %}<p class="mt-1 text-sm text-slate-600">{{ field.help_text }}</p>{% endif %}
  {% for error in field.errors %}<p class="mt-1 text-sm text-red-700">{{ error }}</p>{% endfor %}
</div>
